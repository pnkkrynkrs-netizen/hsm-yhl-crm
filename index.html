<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1830">
<title>HSM & YHL CRM Mobile</title>

<style>
:root{
--navy:#0b1830;
--gold:#c9a45c;
--bg:#f4f6f9;
--card:#fff;
--text:#142033;
--muted:#718096;
--line:#e3e7ed;
--ok:#15803d;
--warn:#b7791f;
--red:#c0392b
}

*{box-sizing:border-box}

html,body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
-webkit-tap-highlight-color:transparent
}

body{padding-bottom:82px}

.app{
max-width:760px;
margin:auto
}

.top{
background:var(--navy);
color:#fff;
padding:calc(18px + env(safe-area-inset-top)) 18px 18px;
position:sticky;
top:0;
z-index:4
}

.toprow{
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-weight:800;
font-size:21px;
letter-spacing:.5px
}

.logo small{
display:block;
color:var(--gold);
font-size:10px;
letter-spacing:1.4px;
margin-top:2px
}

.offline{
font-size:10px;
background:#143653;
border:1px solid #2a5270;
border-radius:20px;
padding:6px 9px
}

.content{padding:15px}

.title{
font-size:25px;
font-weight:800;
margin:4px 0
}

.subtitle{
font-size:13px;
color:var(--muted);
margin-bottom:15px
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:15px;
padding:15px;
box-shadow:0 4px 16px #00000007
}

.metric{
font-size:22px;
font-weight:800;
margin-top:5px
}

.label{
font-size:11px;
color:var(--muted)
}

.section{
background:#fff;
border:1px solid var(--line);
border-radius:15px;
padding:15px;
margin:12px 0
}

.section h2{
font-size:16px;
margin:0 0 12px
}

.btn{
border:0;
border-radius:11px;
padding:12px 14px;
font-weight:750;
font-size:14px;
background:var(--navy);
color:#fff;
min-height:44px
}

.gold{
background:var(--gold);
color:#101010
}

.light{
background:#edf1f5;
color:#253244
}

.danger{
background:#fdebea;
color:var(--red)
}

.toolbar{
display:flex;
gap:8px;
overflow:auto;
margin-bottom:12px
}

.toolbar .btn{
white-space:nowrap
}

.search{
margin-bottom:10px
}

input,select,textarea{
width:100%;
border:1px solid #d8dee7;
border-radius:11px;
padding:12px;
font:inherit;
background:#fff;
color:var(--text);
font-size:16px
}

textarea{
min-height:88px
}

.formgrid{
display:grid;
gap:11px
}

label{
display:block;
font-size:12px;
font-weight:700;
color:#5d6978;
margin:0 0 5px
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.list{
display:grid;
gap:9px
}

.item{
background:#fff;
border:1px solid var(--line);
border-radius:13px;
padding:13px
}

.itemhead{
display:flex;
justify-content:space-between;
gap:8px
}

.item b{
font-size:14px
}

.meta{
font-size:12px;
color:var(--muted);
margin-top:5px;
line-height:1.45
}

.pill{
display:inline-block;
border-radius:20px;
padding:5px 8px;
font-size:10px;
font-weight:800;
background:#eef1f5
}

.ok{
background:#e8f7ee;
color:var(--ok)
}

.warn{
background:#fff4dc;
color:var(--warn)
}

.red{
background:#fdebea;
color:var(--red)
}

.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
background:#fff;
border-top:1px solid var(--line);
z-index:10;
padding:7px 6px calc(7px + env(safe-area-inset-bottom));
display:grid;
grid-template-columns:repeat(5,1fr);
max-width:760px;
margin:auto
}

.navbtn{
border:0;
background:transparent;
color:#667085;
font-size:10px;
padding:5px 1px
}

.navbtn .ico{
font-size:20px;
display:block;
margin-bottom:2px
}

.navbtn.active{
color:var(--navy);
font-weight:800
}

.fab{
position:fixed;
right:18px;
bottom:92px;
width:54px;
height:54px;
border:0;
border-radius:50%;
background:var(--gold);
font-size:27px;
box-shadow:0 8px 22px #0003;
z-index:5
}

.modal{
position:fixed;
inset:0;
background:#0008;
z-index:20;
display:none;
align-items:flex-end
}

.modal.open{
display:flex
}

.sheet{
background:#fff;
width:100%;
max-height:92vh;
overflow:auto;
border-radius:20px 20px 0 0;
padding:18px 16px calc(20px + env(safe-area-inset-bottom))
}

.sheethead{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px
}

.x{
border:0;
border-radius:50%;
width:36px;
height:36px;
font-size:22px
}

.empty{
text-align:center;
color:var(--muted);
padding:24px 10px;
font-size:13px
}

.note{
font-size:12px;
background:#fff8e7;
border:1px solid #efdfb2;
padding:11px;
border-radius:11px;
color:#6a571f;
line-height:1.4
}

.hidden{
display:none
}

.profit{
font-size:18px;
font-weight:800
}

.commission-box{
background:#f8fafc;
border:1px solid var(--line);
border-radius:12px;
padding:12px;
margin-top:10px
}

.commission-row{
display:flex;
justify-content:space-between;
gap:10px;
font-size:13px;
padding:5px 0
}

.commission-row.total{
border-top:1px solid var(--line);
margin-top:6px;
padding-top:9px;
font-weight:800
}

.statgrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.stat{
background:#f7f9fb;
border:1px solid var(--line);
border-radius:12px;
padding:11px
}

.stat .big{
font-size:18px;
font-weight:800;
margin-top:4px
}

hr{
border:0;
border-top:1px solid var(--line);
margin:12px 0
}
</style>
</head>

<body>

<div class="app">

<header class="top">
<div class="toprow">
<div class="logo">
HSM & YHL
<small>TRAVEL CRM</small>
</div>
<div class="offline">● OFFLINE</div>
</div>
</header>

<main id="view" class="content"></main>

<nav class="bottom">
<button class="navbtn active" data-p="home">
<span class="ico">📊</span>Inicio
</button>

<button class="navbtn" data-p="clients">
<span class="ico">👥</span>Clientes
</button>

<button class="navbtn" data-p="services">
<span class="ico">✈️</span>Servicios
</button>

<button class="navbtn" data-p="payments">
<span class="ico">💰</span>Pagos
</button>

<button class="navbtn" data-p="more">
<span class="ico">☰</span>Más
</button>
</nav>

<button class="fab" id="fab">+</button>

</div>

<div class="modal" id="modal">
<div class="sheet">

<div class="sheethead">
<b id="mtitle"></b>
<button class="x" onclick="closeModal()">×</button>
</div>

<div id="mbody"></div>

</div>
</div>

<script>

/* =========================================================
   BASE DE DATOS
========================================================= */

const KEY="hsm_yhl_mobile_v2";

let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
clients:[],
services:[],
payments:[],
gestors:[],
tasks:[]
};

/* =========================================================
   MIGRACIÓN DE DATOS ANTIGUOS
   No borra información existente.
========================================================= */

db.clients=db.clients||[];
db.services=db.services||[];
db.payments=db.payments||[];
db.gestors=db.gestors||[];
db.tasks=db.tasks||[];

db.services=db.services.map(s=>({
...s,
gestorCommission:Number(s.gestorCommission||0),
yiselCommission:Number(s.yiselCommission||0),
haroldCommission:Number(s.haroldCommission||0),
otherCosts:Number(s.otherCosts||0)
}));

let pageNow="home";

/* =========================================================
   UTILIDADES
========================================================= */

const save=()=>localStorage.setItem(KEY,JSON.stringify(db));

const id=()=>crypto.randomUUID?
crypto.randomUUID():
Date.now()+"-"+Math.random();

const esc=s=>String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

const money=(n,c="USD")=>
new Intl.NumberFormat("en-US",{
style:"currency",
currency:c,
maximumFractionDigits:2
}).format(Number(n)||0);

const cname=id=>
db.clients.find(x=>x.id===id)?.name||"—";

const gname=id=>
db.gestors.find(x=>x.id===id)?.name||"—";

const paid=sid=>
db.payments
.filter(x=>x.serviceId===sid)
.reduce((a,x)=>a+Number(x.amount||0),0);

const serviceCommissions=s=>({
gestor:Number(s.gestorCommission||0),
yisel:Number(s.yiselCommission||0),
harold:Number(s.haroldCommission||0),
other:Number(s.otherCosts||0)
});

const totalCosts=s=>{
let c=serviceCommissions(s);
return c.gestor+c.yisel+c.harold+c.other;
};

const profit=s=>
Number(s.total||0)-totalCosts(s);

/* =========================================================
   NAVEGACIÓN
========================================================= */

function go(p){
pageNow=p;

document
.querySelectorAll(".navbtn")
.forEach(b=>
b.classList.toggle("active",b.dataset.p===p)
);

render();
}

document
.querySelectorAll(".navbtn")
.forEach(b=>
b.onclick=()=>go(b.dataset.p)
);

document.getElementById("fab").onclick=()=>{

if(pageNow==="clients")clientForm();

else if(pageNow==="services")serviceForm();

else if(pageNow==="payments")paymentForm();

else if(pageNow==="more")gestorForm();

else taskForm();

};

/* =========================================================
   RENDER PRINCIPAL
========================================================= */

function render(){

let v=document.getElementById("view");

if(pageNow==="home")home(v);

else if(pageNow==="clients")clients(v);

else if(pageNow==="services")services(v);

else if(pageNow==="payments")payments(v);

else more(v);

}

/* =========================================================
   CABECERA
========================================================= */

function head(t,s){

return `
<div class="title">${t}</div>
<div class="subtitle">${s}</div>
`;

}

/* =========================================================
   INICIO
========================================================= */

function home(v){

let sales=db.services.reduce(
(a,x)=>a+Number(x.total||0),0
);

let collected=db.payments.reduce(
(a,x)=>a+Number(x.amount||0),0
);

let pending=db.services.reduce(
(a,x)=>a+Math.max(0,Number(x.total||0)-paid(x.id)),
0
);

let profits=db.services.reduce(
(a,x)=>a+profit(x),
0
);

v.innerHTML=
head(
"Buenos días 👋",
"Centro de operaciones HSM Exclusive Journeys + YHL Travels"
)+`

<div class="cards">

<div class="card">
<div class="label">VENTAS</div>
<div class="metric">${money(sales)}</div>
</div>

<div class="card">
<div class="label">COBRADO</div>
<div class="metric">${money(collected)}</div>
</div>

<div class="card">
<div class="label">PENDIENTE</div>
<div class="metric">${money(pending)}</div>
</div>

<div class="card">
<div class="label">GANANCIA</div>
<div class="metric">${money(profits)}</div>
</div>

</div>

<div class="section">

<h2>Acciones rápidas</h2>

<div class="toolbar">

<button class="btn gold"
onclick="clientForm()">
+ Cliente
</button>

<button class="btn light"
onclick="serviceForm()">
+ Servicio
</button>

<button class="btn light"
onclick="paymentForm()">
+ Pago
</button>

</div>

</div>

<div class="section">

<h2>Últimos servicios</h2>

${serviceList(db.services.slice(-5).reverse())}

</div>

<div class="section">

<h2>Resumen de comisiones</h2>

${commissionMiniSummary()}

<button class="btn light"
style="margin-top:10px"
onclick="showCommissions()">
Ver todas las comisiones
</button>

</div>
`;

}

/* =========================================================
   CLIENTES
========================================================= */

function clients(v){

v.innerHTML=
head(
"Clientes",
"Tu base de clientes, guardada en este dispositivo"
)+`

<input
id="q"
class="search"
placeholder="🔎 Buscar cliente..."
oninput="clientSearch()">

<div id="clist">
${clientList(db.clients)}
</div>
`;

}

function clientList(a){

if(!a.length)

return `
<div class="empty">
No hay clientes todavía.
<br><br>
<button class="btn gold"
onclick="clientForm()">
Crear primer cliente
</button>
</div>
`;

return `
<div class="list">

${a.map(x=>`

<div class="item">

<div class="itemhead">

<div>

<b>${esc(x.name)}</b>

<div class="meta">
${esc(x.phone||"Sin teléfono")}
 ·
${esc(x.country||"Sin país")}
</div>

</div>

<button class="btn light"
onclick="clientForm('${x.id}')">
Editar
</button>

</div>

<div class="meta">
${esc(x.email||"Sin email")}
 ·
${db.services.filter(s=>s.clientId===x.id).length}
 servicio(s)
</div>

</div>

`).join("")}

</div>
`;

}

function clientSearch(){

let q=document
.getElementById("q")
.value
.toLowerCase();

document.getElementById("clist").innerHTML=
clientList(
db.clients.filter(x=>
(x.name+" "+x.phone+" "+x.email+" "+x.country)
.toLowerCase()
.includes(q)
)
);

}

function clientForm(i=""){

let x=db.clients.find(a=>a.id===i)||{};

openModal(
i?"Editar cliente":"Nuevo cliente",
`

<form onsubmit="saveClient(event,'${i}')">

<div class="formgrid">

<label>
Nombre completo
<input required name="name" value="${esc(x.name)}">
</label>

<div class="row">

<label>
WhatsApp / Teléfono
<input name="phone" value="${esc(x.phone)}">
</label>

<label>
País
<input name="country" value="${esc(x.country)}">
</label>

</div>

<label>
Email
<input type="email" name="email" value="${esc(x.email)}">
</label>

<label>
Gestor

<select name="gestorId">

<option value="">
Sin gestor
</option>

${db.gestors.map(g=>`

<option
value="${g.id}"
${x.gestorId===g.id?"selected":""}>
${esc(g.name)}
</option>

`).join("")}

</select>

</label>

<label>
Notas
<textarea name="notes">${esc(x.notes)}</textarea>
</label>

<button class="btn gold">
Guardar cliente
</button>

</div>

</form>
`
);

}

function saveClient(e,i){

e.preventDefault();

let f=new FormData(e.target);

let x={
id:i||id(),
name:f.get("name"),
phone:f.get("phone"),
country:f.get("country"),
email:f.get("email"),
gestorId:f.get("gestorId"),
notes:f.get("notes")
};

if(i)

db.clients=db.clients.map(
a=>a.id===i?x:a
);

else

db.clients.push(x);

save();
closeModal();
render();

}

/* =========================================================
   SERVICIOS
========================================================= */

function services(v){

v.innerHTML=
head(
"Servicios",
"Boletos, hoteles, visas, paquetes y más"
)+`

<input
id="sq"
class="search"
placeholder="🔎 Buscar servicio o cliente..."
oninput="serviceSearch()">

<div id="slist">
${serviceList(db.services.slice().reverse())}
</div>
`;

}

function serviceList(a){

if(!a.length)

return `
<div class="empty">
No hay servicios registrados.
</div>
`;

return `
<div class="list">

${a.map(s=>{

let p=paid(s.id);

let st=
p>=Number(s.total||0)&&Number(s.total||0)>0
?"Pagado":
p>0
?"Abono":
"Pendiente";

let pr=profit(s);

return `

<div class="item">

<div class="itemhead">

<div>

<b>${esc(cname(s.clientId))}</b>

<div class="meta">
${esc(s.type)}
 ·
${esc(s.company)}
 ·
${esc(s.date)}
</div>

</div>

<span class="pill ${
st==="Pagado"?"ok":
st==="Abono"?"warn":"red"
}">
${st}
</span>

</div>

<div class="meta">

<b>${money(s.total,s.currency)}</b>

 · Cobrado
${money(p,s.currency)}

 ·
${s.passengers}
 pasajero(s)

 · Gestor:
${esc(gname(s.gestorId))}

</div>

<div class="commission-box">

<div class="commission-row">
<span>Comisión gestor</span>
<b>${money(s.gestorCommission,s.currency)}</b>
</div>

<div class="commission-row">
<span>Comisión Yisel</span>
<b>${money(s.yiselCommission,s.currency)}</b>
</div>

<div class="commission-row">
<span>Comisión Harold</span>
<b>${money(s.haroldCommission,s.currency)}</b>
</div>

<div class="commission-row">
<span>Otros costos</span>
<b>${money(s.otherCosts,s.currency)}</b>
</div>

<div class="commission-row total">
<span>Ganancia</span>
<b>${money(pr,s.currency)}</b>
</div>

</div>

<div style="margin-top:9px">

<button class="btn light"
onclick="serviceForm('${s.id}')">
Ver / editar
</button>

</div>

</div>

`;

}).join("")}

</div>
`;

}

function serviceSearch(){

let q=document
.getElementById("sq")
.value
.toLowerCase();

document.getElementById("slist").innerHTML=
serviceList(
db.services
.filter(s=>
(cname(s.clientId)+" "+s.type+" "+s.company)
.toLowerCase()
.includes(q)
)
.reverse()
);

}

/* =========================================================
   FORMULARIO DE SERVICIO
========================================================= */

function serviceForm(i=""){

let x=db.services.find(a=>a.id===i)||{};

x.gestorCommission=Number(x.gestorCommission||0);
x.yiselCommission=Number(x.yiselCommission||0);
x.haroldCommission=Number(x.haroldCommission||0);
x.otherCosts=Number(x.otherCosts||0);

let currentProfit=
Number(x.total||0)
-
x.gestorCommission
-
x.yiselCommission
-
x.haroldCommission
-
x.otherCosts;

openModal(
i?"Editar servicio":"Nuevo servicio",
`

<form onsubmit="saveService(event,'${i}')">

<div class="formgrid">

<div class="row">

<label>
Empresa

<select name="company">

<option
${x.company==="HSM"||!i?"selected":""}>
HSM
</option>

<option
${x.company==="YHL"?"selected":""}>
YHL
</option>

</select>

</label>

<label>
Tipo

<select name="type">

${[
"Boleto",
"Hotel",
"Paquete",
"Visa",
"Rent a car",
"Traslado",
"Otro"
].map(t=>`

<option
${x.type===t?"selected":""}>
${t}
</option>

`).join("")}

</select>

</label>

</div>

<label>
Cliente

<select required name="clientId">

<option value="">
Seleccionar...
</option>

${db.clients.map(c=>`

<option
value="${c.id}"
${x.clientId===c.id?"selected":""}>
${esc(c.name)}
</option>

`).join("")}

</select>

</label>

<div class="row">

<label>
Fecha
<input
type="date"
name="date"
value="${x.date||new Date().toISOString().slice(0,10)}">
</label>

<label>
Pasajeros
<input
type="number"
min="1"
name="passengers"
value="${x.passengers||1}">
</label>

</div>

<div class="row">

<label>
Valor total
<input
required
type="number"
step="0.01"
name="total"
value="${x.total||""}">
</label>

<label>
Moneda

<select name="currency">

${["USD","EUR","CUP"].map(c=>`

<option
${x.currency===c||
(!x.currency&&c==="USD")
?"selected":""}>
${c}
</option>

`).join("")}

</select>

</label>

</div>

<div class="row">

<label>
Gestor

<select name="gestorId">

<option value="">
Sin gestor
</option>

${db.gestors.map(g=>`

<option
value="${g.id}"
${x.gestorId===g.id?"selected":""}>
${esc(g.name)}
</option>

`).join("")}

</select>

</label>

<label>
Comisión gestor

<input
type="number"
step="0.01"
name="gestorCommission"
value="${x.gestorCommission}">
</label>

</div>

<hr>

<div class="note">
Aquí puedes registrar las comisiones y costos de esta operación.
La ganancia se calcula automáticamente.
</div>

<div class="row">

<label>
Comisión Yisel

<input
type="number"
step="0.01"
name="yiselCommission"
value="${x.yiselCommission}">
</label>

<label>
Comisión Harold

<input
type="number"
step="0.01"
name="haroldCommission"
value="${x.haroldCommission}">
</label>

</div>

<label>
Otros costos

<input
type="number"
step="0.01"
name="otherCosts"
value="${x.otherCosts}">
</label>

<div class="commission-box">

<div class="commission-row">
<span>Valor del servicio</span>
<b id="previewTotal">
${money(x.total||0,x.currency||"USD")}

/* =========================================================

========================================================= */

function exportData(){

let b=new Blob(
[JSON.stringify(db,null,2)],
{type:"application/json"}
);

let a=document.createElement("a");

a.href=URL.createObjectURL(b);

a.download=
"HSM-YHL-CRM-"+
new Date().toISOString().slice(0,10)+
".json";

a.click();

setTimeout(
()=>URL.revokeObjectURL(a.href),
1000
);

}

function importData(e){

let f=e.target.files[0];

if(!f)return;

let r=new FileReader();

r.onload=()=>{

try{

let x=JSON.parse(r.result);

if(!x.clients||
!x.services||
!x.payments)
throw 0;

x.gestors=x.gestors||[];
x.tasks=x.tasks||[];

x.services=x.services.map(s=>({
...s,
gestorCommission:
Number(s.gestorCommission||0),

yiselCommission:
Number(s.yiselCommission||0),

haroldCommission:
Number(s.haroldCommission||0),

otherCosts:
Number(s.otherCosts||0)
}));

db=x;

save();
render();

alert(
"Respaldo restaurado correctamente."
);

}catch{

alert(
"Respaldo no válido."
);

}

};

r.readAsText(f);

}
