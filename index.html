<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1830">
<title>HSM & YHL CRM</title>

<style>
:root{
  --navy:#0b1830;
  --gold:#c9a45c;
  --bg:#f4f6f9;
  --card:#fff;
  --text:#142033;
  --muted:#718096;
  --line:#e3e7ed;
  --ok:#15803d;
  --warn:#b7791f;
  --red:#c0392b;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{padding-bottom:88px}

.app{
  max-width:760px;
  margin:auto;
}

.top{
  background:var(--navy);
  color:#fff;
  padding:calc(18px + env(safe-area-inset-top)) 18px 18px;
  position:sticky;
  top:0;
  z-index:4;
}

.toprow{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-weight:800;
  font-size:21px;
  letter-spacing:.5px;
}

.logo small{
  display:block;
  color:var(--gold);
  font-size:10px;
  letter-spacing:1.4px;
  margin-top:2px;
}

.offline{
  font-size:10px;
  background:#143653;
  border:1px solid #2a5270;
  border-radius:20px;
  padding:6px 9px;
}

.content{padding:15px}

.title{
  font-size:25px;
  font-weight:800;
  margin:4px 0;
}

.subtitle{
  font-size:13px;
  color:var(--muted);
  margin-bottom:15px;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
  box-shadow:0 4px 16px #00000007;
}

.metric{
  font-size:22px;
  font-weight:800;
  margin-top:5px;
}

.label{
  font-size:11px;
  color:var(--muted);
}

.section{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
  margin:12px 0;
}

.section h2{
  font-size:16px;
  margin:0 0 12px;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 14px;
  font-weight:750;
  font-size:14px;
  background:var(--navy);
  color:#fff;
  min-height:44px;
  cursor:pointer;
}

.gold{
  background:var(--gold);
  color:#101010;
}

.light{
  background:#edf1f5;
  color:#253244;
}

.danger{
  background:#fdebea;
  color:var(--red);
}

.toolbar{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:12px;
}

.toolbar .btn{
  white-space:nowrap;
}

.search{
  margin-bottom:10px;
}

input,select,textarea{
  width:100%;
  border:1px solid #d8dee7;
  border-radius:11px;
  padding:12px;
  font:inherit;
  background:#fff;
  color:var(--text);
  font-size:16px;
}

textarea{
  min-height:88px;
}

.formgrid{
  display:grid;
  gap:11px;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:#5d6978;
  margin:0 0 5px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.list{
  display:grid;
  gap:9px;
}

.item{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
}

.itemhead{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.item b{
  font-size:14px;
}

.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
  line-height:1.45;
}

.pill{
  display:inline-block;
  border-radius:20px;
  padding:5px 8px;
  font-size:10px;
  font-weight:800;
  background:#eef1f5;
}

.ok{
  background:#e8f7ee;
  color:var(--ok);
}

.warn{
  background:#fff4dc;
  color:var(--warn);
}

.red{
  background:#fdebea;
  color:var(--red);
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid var(--line);
  z-index:10;
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(6,1fr);
  max-width:760px;
  margin:auto;
}

.navbtn{
  border:0;
  background:transparent;
  color:#667085;
  font-size:9px;
  padding:5px 1px;
  cursor:pointer;
}

.navbtn .ico{
  font-size:19px;
  display:block;
  margin-bottom:2px;
}

.navbtn.active{
  color:var(--navy);
  font-weight:800;
}

.fab{
  position:fixed;
  right:18px;
  bottom:95px;
  width:54px;
  height:54px;
  border:0;
  border-radius:50%;
  background:var(--gold);
  font-size:27px;
  box-shadow:0 8px 22px #0003;
  z-index:5;
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:20;
  display:none;
  align-items:flex-end;
}

.modal.open{
  display:flex;
}

.sheet{
  background:#fff;
  width:100%;
  max-height:92vh;
  overflow:auto;
  border-radius:20px 20px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));
}

.sheethead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.x{
  border:0;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:22px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:24px 10px;
  font-size:13px;
}

.note{
  font-size:12px;
  background:#fff8e7;
  border:1px solid #efdfb2;
  padding:11px;
  border-radius:11px;
  color:#6a571f;
  line-height:1.4;
}

.hidden{
  display:none;
}

.financial{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.finbox{
  background:#f7f8fa;
  border-radius:11px;
  padding:10px;
}

.finbox .flabel{
  font-size:10px;
  color:var(--muted);
}

.finbox .fvalue{
  font-size:16px;
  font-weight:800;
  margin-top:3px;
}

.profit{
  background:#e8f7ee;
}

.loss{
  background:#fdebea;
}

.commission-grid{
  display:grid;
  gap:8px;
}

.commission-row{
  background:#f7f8fa;
  border-radius:12px;
  padding:10px;
}

.commission-row strong{
  display:block;
  font-size:13px;
  margin-bottom:7px;
}

.small{
  font-size:11px;
  color:var(--muted);
}

.total-highlight{
  background:var(--navy);
  color:#fff;
  border-radius:15px;
  padding:16px;
  margin:12px 0;
}

.total-highlight .big{
  font-size:26px;
  font-weight:800;
}

.total-highlight .small{
  color:#cbd5e1;
}

@media(max-width:390px){
  .navbtn{font-size:8px}
  .navbtn .ico{font-size:18px}
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <div class="toprow">
    <div class="logo">
      HSM & YHL
      <small>TRAVEL CRM</small>
    </div>
    <div class="offline">● OFFLINE</div>
  </div>
</header>

<main id="view" class="content"></main>

<nav class="bottom">

  <button class="navbtn active" data-p="home">
    <span class="ico">📊</span>Inicio
  </button>

  <button class="navbtn" data-p="clients">
    <span class="ico">👥</span>Clientes
  </button>

  <button class="navbtn" data-p="services">
    <span class="ico">✈️</span>Servicios
  </button>

  <button class="navbtn" data-p="payments">
    <span class="ico">💰</span>Pagos
  </button>

  <button class="navbtn" data-p="commissions">
    <span class="ico">💵</span>Comisiones
  </button>

  <button class="navbtn" data-p="more">
    <span class="ico">☰</span>Más
  </button>

</nav>

<button class="fab" id="fab">+</button>

</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheethead">
      <b id="mtitle"></b>
      <button class="x" onclick="closeModal()">×</button>
    </div>
    <div id="mbody"></div>
  </div>
</div>

<script>

/* =========================================================
   BASE DE DATOS
   ========================================================= */

const KEY="hsm_yhl_mobile_v2";

let raw=localStorage.getItem(KEY);

let db;

try{
  db=JSON.parse(raw)||{};
}catch{
  db={};
}

db.clients=db.clients||[];
db.services=db.services||[];
db.payments=db.payments||[];
db.gestors=db.gestors||[];
db.tasks=db.tasks||[];

let pageNow="home";


/* =========================================================
   UTILIDADES
   ========================================================= */

const save=()=>{
  localStorage.setItem(KEY,JSON.stringify(db));
};

const id=()=>{
  return crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now()+"-"+Math.random();
};

const esc=s=>
  String(s??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m]));

const num=n=>Number(n)||0;

const money=(n,c="USD")=>{
  try{
    return new Intl.NumberFormat("en-US",{
      style:"currency",
      currency:c,
      maximumFractionDigits:2
    }).format(num(n));
  }catch{
    return num(n).toFixed(2)+" "+c;
  }
};

const today=()=>{
  return new Date().toISOString().slice(0,10);
};

const cname=cid=>{
  return db.clients.find(x=>x.id===cid)?.name||"—";
};

const gname=gid=>{
  return db.gestors.find(x=>x.id===gid)?.name||"—";
};

const paid=sid=>{
  return db.payments
    .filter(x=>x.serviceId===sid)
    .reduce((a,x)=>a+num(x.amount),0);
};


/* =========================================================
   COMISIONES
   ========================================================= */

function commissionAmount(service,person){

  let type="";
  let value=0;

  if(person==="gestor"){
    type=service.gestorCommissionType||"fixed";
    value=num(service.gestorCommissionValue);

    /* Compatibilidad con versión anterior */
    if(!service.gestorCommissionType){
      value=num(service.gestorCommission);
      type="fixed";
    }
  }

  if(person==="yisel"){
    type=service.yiselCommissionType||"fixed";
    value=num(service.yiselCommissionValue);
  }

  if(person==="harold"){
    type=service.haroldCommissionType||"fixed";
    value=num(service.haroldCommissionValue);
  }

  if(type==="percent"){
    return num(service.total)*(value/100);
  }

  return value;
}

function serviceFinancials(service){

  const gestor=commissionAmount(service,"gestor");
  const yisel=commissionAmount(service,"yisel");
  const harold=commissionAmount(service,"harold");

  const cost=num(service.cost);
  const other=num(service.otherCost);

  const profit=
    num(service.total)
    -cost
    -gestor
    -yisel
    -harold
    -other;

  return {
    gestor,
    yisel,
    harold,
    cost,
    other,
    profit
  };
}

function totals(){

  let sales=0;
  let costs=0;
  let gestor=0;
  let yisel=0;
  let harold=0;
  let other=0;
  let profit=0;

  db.services.forEach(s=>{

    sales+=num(s.total);

    const f=serviceFinancials(s);

    costs+=f.cost;
    gestor+=f.gestor;
    yisel+=f.yisel;
    harold+=f.harold;
    other+=f.other;
    profit+=f.profit;

  });

  return {
    sales,
    costs,
    gestor,
    yisel,
    harold,
    other,
    profit,
    commissions:gestor+yisel+harold
  };
}


/* =========================================================
   NAVEGACIÓN
   ========================================================= */

function go(p){

  pageNow=p;

  document
    .querySelectorAll(".navbtn")
    .forEach(b=>{
      b.classList.toggle(
        "active",
        b.dataset.p===p
      );
    });

  render();
}

document
  .querySelectorAll(".navbtn")
  .forEach(b=>{
    b.onclick=()=>go(b.dataset.p);
  });


document.getElementById("fab").onclick=()=>{

  if(pageNow==="clients"){
    clientForm();
    return;
  }

  if(pageNow==="services"){
    serviceForm();
    return;
  }

  if(pageNow==="payments"){
    paymentForm();
    return;
  }

  if(pageNow==="commissions"){
    serviceForm();
    return;
  }

  gestorForm();

};


/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */

function render(){

  let v=document.getElementById("view");

  if(pageNow==="home"){
    home(v);
  }
  else if(pageNow==="clients"){
    clients(v);
  }
  else if(pageNow==="services"){
    services(v);
  }
  else if(pageNow==="payments"){
    payments(v);
  }
  else if(pageNow==="commissions"){
    commissions(v);
  }
  else{
    more(v);
  }

}


/* =========================================================
   CABECERA
   ========================================================= */

function head(t,s){

  return `
    <div class="title">${t}</div>
    <div class="subtitle">${s}</div>
  `;

}


/* =========================================================
   INICIO
   ========================================================= */

function home(v){

  const sales=
    db.services.reduce(
      (a,x)=>a+num(x.total),
      0
    );

  const collected=
    db.payments.reduce(
      (a,x)=>a+num(x.amount),
      0
    );

  const pending=
    db.services.reduce(
      (a,x)=>a+Math.max(
        0,
        num(x.total)-paid(x.id)
      ),
      0
    );

  const t=totals();

  v.innerHTML=

    head(
      "Buenos días 👋",
      "Centro de operaciones HSM Exclusive Journeys + YHL Travels"
    )

    +`

    <div class="cards">

      <div class="card">
        <div class="label">VENTAS</div>
        <div class="metric">${money(sales)}</div>
      </div>

      <div class="card">
        <div class="label">COBRADO</div>
        <div class="metric">${money(collected)}</div>
      </div>

      <div class="card">
        <div class="label">PENDIENTE</div>
        <div class="metric">${money(pending)}</div>
      </div>

      <div class="card">
        <div class="label">GANANCIA</div>
        <div class="metric">${money(t.profit)}</div>
      </div>

    </div>

    <div class="section">

      <h2>Acciones rápidas</h2>

      <div class="toolbar">

        <button
          class="btn gold"
          onclick="clientForm()">
          + Cliente
        </button>

        <button
          class="btn light"
          onclick="serviceForm()">
          + Servicio
        </button>

        <button
          class="btn light"
          onclick="paymentForm()">
          + Pago
        </button>

      </div>

    </div>

    <div class="section">

      <h2>Resumen financiero</h2>

      <div class="financial">

        <div class="finbox">
          <div class="flabel">Costos servicio</div>
          <div class="fvalue">${money(t.costs)}</div>
        </div>

        <div class="finbox">
          <div class="flabel">Otros costos</div>
          <div class="fvalue">${money(t.other)}</div>
        </div>

        <div class="finbox">
          <div class="flabel">Comisiones gestores</div>
          <div class="fvalue">${money(t.gestor)}</div>
        </div>

        <div class="finbox">
          <div class="flabel">Comisiones Yisel</div>
          <div class="fvalue">${money(t.yisel)}</div>
        </div>

        <div class="finbox">
          <div class="flabel">Comisiones Harold</div>
          <div class="fvalue">${money(t.harold)}</div>
        </div>

        <div class="finbox ${t.profit>=0?"profit":"loss"}">
          <div class="flabel">Ganancia total</div>
          <div class="fvalue">${money(t.profit)}</div>
        </div>

      </div>

    </div>

    <div class="section">

      <h2>Últimos servicios</h2>

      ${serviceList(
        db.services
          .slice(-5)
          .reverse()
      )}

    </div>
  `;
}


/* =========================================================
   CLIENTES
   ========================================================= */

function clients(v){

  v.innerHTML=

    head(
      "Clientes",
      "Tu base de clientes, guardada en este dispositivo"
    )

    +`

    <input
      id="q"
      class="search"
      placeholder="🔎 Buscar cliente..."
      oninput="clientSearch()">

    <div id="clist">
      ${clientList(db.clients)}
    </div>
  `;

}

function clientList(a){

  if(!a.length){

    return `
      <div class="empty">
        No hay clientes todavía.
        <br><br>

        <button
          class="btn gold"
          onclick="clientForm()">
          Crear primer cliente
        </button>
      </div>
    `;

  }

  return `
    <div class="list">

      ${a.map(x=>`

        <div class="item">

          <div class="itemhead">

            <div>

              <b>${esc(x.name)}</b>

              <div class="meta">
                ${esc(x.phone||"Sin teléfono")}
                ·
                ${esc(x.country||"Sin país")}
              </div>

            </div>

            <button
              class="btn light"
              onclick="clientForm('${x.id}')">
              Editar
            </button>

          </div>

          <div class="meta">
            ${esc(x.email||"Sin email")}
            ·
            ${db.services.filter(
              s=>s.clientId===x.id
            ).length}
            servicio(s)
          </div>

        </div>

      `).join("")}

    </div>
  `;

}

function clientSearch(){

  let q=
    document
      .getElementById("q")
      .value
      .toLowerCase();

  document.getElementById("clist").innerHTML=
    clientList(
      db.clients.filter(x=>
        (
          x.name+" "+
          x.phone+" "+
          x.email+" "+
          x.country
        )
        .toLowerCase()
        .includes(q)
      )
    );

}

function clientForm(i=""){

  let x=
    db.clients.find(a=>a.id===i)||{};

  openModal(
    i?"Editar cliente":"Nuevo cliente",

    `

    <form
      onsubmit="saveClient(event,'${i}')">

      <div class="formgrid">

        <label>
          Nombre completo
          <input
            required
            name="name"
            value="${esc(x.name)}">
        </label>

        <div class="row">

          <label>
            WhatsApp / Teléfono
            <input
              name="phone"
              value="${esc(x.phone)}">
          </label>

          <label>
            País
            <input
              name="country"
              value="${esc(x.country)}">
          </label>

        </div>

        <label>
          Email
          <input
            type="email"
            name="email"
            value="${esc(x.email)}">
        </label>

        <label>
          Gestor

          <select name="gestorId">

            <option value="">
              Sin gestor
            </option>

            ${db.gestors.map(g=>`

              <option
                value="${g.id}"
                ${x.gestorId===g.id?"selected":""}>

                ${esc(g.name)}

              </option>

            `).join("")}

          </select>

        </label>

        <label>
          Notas
          <textarea name="notes">${esc(x.notes)}</textarea>
        </label>

        <button class="btn gold">
          Guardar cliente
        </button>

      </div>

    </form>

    `
  );

}

function saveClient(e,i){

  e.preventDefault();

  let f=new FormData(e.target);

  let x={
    id:i||id(),
    name:f.get("name"),
    phone:f.get("phone"),
    country:f.get("country"),
    email:f.get("email"),
    gestorId:f.get("gestorId"),
    notes:f.get("notes")
  };

  if(i){

    db.clients=
      db.clients.map(
        a=>a.id===i?x:a
      );

  }else{

    db.clients.push(x);

  }

  save();
  closeModal();
  render();

}


/* =========================================================
   SERVICIOS
   ========================================================= */

function services(v){

  v.innerHTML=

    head(
      "Servicios",
      "Boletos, hoteles, visas, paquetes y más"
    )

    +`

    <input
      id="sq"
      class="search"
      placeholder="🔎 Buscar servicio o cliente..."
      oninput="serviceSearch()">

    <div id="slist">
      ${serviceList(
        db.services.slice().reverse()
      )}
    </div>
  `;

}

function serviceList(a){

  if(!a.length){

    return `
      <div class="empty">
        No hay servicios registrados.
      </div>
    `;

  }

  return `
    <div class="list">

      ${a.map(s=>{

        let p=paid(s.id);

        let st=
          p>=num(s.total)&&num(s.total)>0
            ?"Pagado"
            :p>0
              ?"Abono"
              :"Pendiente";

        let f=serviceFinancials(s);

        return `

        <div class="item">

          <div class="itemhead">

            <div>

              <b>
                ${esc(cname(s.clientId))}
              </b>

              <div class="meta">
                ${esc(s.type)}
                ·
                ${esc(s.company)}
                ·
                ${esc(s.date)}
              </div>

            </div>

            <span class="pill ${
              st==="Pagado"
                ?"ok"
                :st==="Abono"
                  ?"warn"
                  :"red"
            }">
              ${st}
            </span>

          </div>

function saveService(e,i){

  e.preventDefault();

  let f=new FormData(e.target);

  let old=
    db.services.find(a=>a.id===i)||{};

  let x={

    id:i||id(),

    company:f.get("company"),

    type:f.get("type"),

    clientId:f.get("clientId"),

    date:f.get("date"),

    passengers:num(f.get("passengers"))||1,

    total:num(f.get("total")),

    currency:f.get("currency"),

    gestorId:f.get("gestorId"),

    gestorCommissionType:
      f.get("gestorCommissionType")||"fixed",

    gestorCommissionValue:
      num(f.get("gestorCommissionValue")),

    yiselCommissionType:
      f.get("yiselCommissionType")||"fixed",

    yiselCommissionValue:
      num(f.get("yiselCommissionValue")),

    haroldCommissionType:
      f.get("haroldCommissionType")||"fixed",

    haroldCommissionValue:
      num(f.get("haroldCommissionValue")),

    cost:
      num(f.get("cost")),

    otherCost:
      num(f.get("otherCost")),

    notes:
      f.get("notes")

  };

  /* Mantener información adicional anterior */
  if(old.createdAt){
    x.createdAt=old.createdAt;
  }else{
    x.createdAt=new Date().toISOString();
  }

  if(i){

    db.services=
      db.services.map(
        a=>a.id===i?x:a
      );

  }else{

    db.services.push(x);

  }

  save();
  closeModal();
  render();

}

        </button>

        <button
          class="btn light"
          onclick="
            document
              .getElementById('imp')
              .click()
          ">

          ⬆ Importar

        </button>

        <input
          id="imp"
          class="hidden"
          type="file"
          accept=".json"
          onchange="importData(event)">

      </div>

    </div>


    <div class="section">

      <h2>
        Resumen
      </h2>

      <div class="meta">

        ${db.clients.length}
        clientes

        ·

        ${db.services.length}
        servicios

        ·

        ${db.payments.length}
        pagos

        ·

        ${db.gestors.length}
        gestores

      </div>

    </div>

  `;

}


/* =========================================================
   AGENDA
   ========================================================= */

function taskForm(){

  openModal(

    "Nueva tarea",

    `

    <form
      onsubmit="saveTask(event)">

      <div class="formgrid">

        <label>
          Tarea

          <input
            required
            name="title">

        </label>


        <div class="row">

          <label>
            Fecha

            <input
              type="date"
              name="date"
              value="${today()}">

          </label>


          <label>
            Responsable

            <select name="gestorId">

              <option value="">
                Sin asignar
              </option>

              ${db.gestors.map(g=>`

                <option value="${g.id}">

                  ${esc(g.name)}

                </option>

              `).join("")}

            </select>

          </label>

        </div>


        <button class="btn gold">
          Guardar
        </button>

      </div>

    </form>

    `
  );

}

function saveTask(e){

  e.preventDefault();

  let f=new FormData(e.target);

  db.tasks.push({

    id:id(),

    title:
      f.get("title"),

    date:
      f.get("date"),

    gestorId:
      f.get("gestorId"),

    done:false

  });

  save();
  closeModal();
  render();

}

function toggleTask(i){

  let t=
    db.tasks.find(
      x=>x.id===i
    );

  if(!t)return;

  t.done=!t.done;

  save();
  render();

}


/* =========================================================
   EXPORTAR / IMPORTAR
   ========================================================= */

function exportData(){

  let b=new Blob(
    [
      JSON.stringify(
        db,
        null,
        2
      )
    ],
    {
      type:"application/json"
    }
  );

  let a=
    document.createElement("a");

  a.href=
    URL.createObjectURL(b);

  a.download=
    "HSM-YHL-CRM-"+
    today()+
    ".json";

  a.click();

  setTimeout(
    ()=>URL.revokeObjectURL(a.href),
    1000
  );

}

function importData(e){

  let f=
    e.target.files[0];

  if(!f)return;

  let r=
    new FileReader();

  r.onload=()=>{

    try{

      let x=
        JSON.parse(
          r.result
        );

      if(
        !x.clients ||
        !x.services ||
        !x.payments
      ){
        throw 0;
      }

      db=x;

      db.clients=
        db.clients||[];

      db.services=
        db.services||[];

      db.payments=
        db.payments||[];

      db.gestors=
        db.gestors||[];

      db.tasks=
        db.tasks||[];

      save();

      render();

      alert(
        "Respaldo restaurado correctamente."
      );

    }catch{

      alert(
        "Respaldo no válido."
      );

    }

  };

  r.readAsText(f);

}


/* =========================================================
   MODAL
   ========================================================= */

function openModal(t,b){

  document
    .getElementById("mtitle")
    .textContent=t;

  document
    .getElementById("mbody")
    .innerHTML=b;

  document
    .getElementById("modal")
    .classList.add("open");

}

function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("open");

}


/* Cerrar tocando fuera */

document
  .getElementById("modal")
  .addEventListener(
    "click",
    e=>{
      if(e.target.id==="modal"){
        closeModal();
      }
    }
  );


/* =========================================================
   INICIO
   ========================================================= */

render();

</script>

</body>
</html>
